name: CreamFrame Installer release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v2.0.0)
        required: true
        default: v2.0.0
      publish:
        description: Publish the GitHub release (otherwise only build artifacts)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            jre_arch: x64
            bundles: appimage,deb
          - runner: ubuntu-24.04-arm
            arch: aarch64
            jre_arch: aarch64
            bundles: appimage,deb
    runs-on: ${{ matrix.runner }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libfuse2t64

      - name: Stage bundled JRE
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/jre.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/21/ga/linux/${{ matrix.jre_arch }}/jre/hotspot/normal/eclipse"
          rm -rf src-tauri/resources/jdk
          mkdir -p src-tauri/resources/jdk
          tar -xzf /tmp/jre.tar.gz --strip-components=1 -C src-tauri/resources/jdk
          chmod +x src-tauri/resources/jdk/bin/java src-tauri/resources/jdk/bin/keytool

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundles
        run: |
          set -euo pipefail
          # linuxdeploy's bundled strip cannot process newer distro libraries.
          # Prefer AppImage; fall back to deb if the AppImage toolchain fails.
          NO_STRIP=true npm run tauri build -- --bundles "${{ matrix.bundles }}" || \
            npm run tauri build -- --bundles deb

      - name: Collect and sign bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist-bundles
          find src-tauri/target/release/bundle -type f \( \
            -name '*.AppImage' -o -name '*.AppImage.sig' -o \
            -name '*.AppImage.tar.gz' -o -name '*.AppImage.tar.gz.sig' -o \
            -name '*.deb' -o -name '*.deb.sig' \) -exec cp {} dist-bundles/ \;
          for f in dist-bundles/*.AppImage dist-bundles/*.deb; do
            [ -f "$f" ] || continue
            if [ ! -f "$f.sig" ]; then
              npx --prefix "$GITHUB_WORKSPACE" tauri signer sign "$f"
            fi
          done
          ls -lh dist-bundles

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.arch }}
          path: dist-bundles

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Build latest.json
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/bundles-*/* release/ || true
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          release = pathlib.Path("release")
          version = json.loads(pathlib.Path("package.json").read_text())["version"]
          tag = "${{ inputs.tag }}"
          repo = "${{ github.repository }}"
          platforms = {}
          for path in sorted(release.iterdir()):
              if path.suffix not in (".AppImage", ".deb"):
                  continue
              sig = path.with_name(path.name + ".sig")
              if not sig.exists():
                  continue
              arch = "aarch64" if "aarch64" in path.name or "arm64" in path.name else "x86_64"
              kind = "appimage" if path.suffix == ".AppImage" else "deb"
              platforms[f"linux-{arch}-{kind}"] = {
                  "signature": sig.read_text().strip(),
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{path.name}",
              }
              if kind == "appimage":
                  platforms[f"linux-{arch}"] = platforms[f"linux-{arch}-{kind}"]
          latest = {
              "version": version,
              "notes": "",
              "pub_date": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          pathlib.Path("release/latest.json").write_text(json.dumps(latest, indent=2))
          print(json.dumps(latest, indent=2))
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ inputs.tag }}" \
            --title "CreamFrame Installer ${{ inputs.tag }}" \
            --notes "CreamFrame Installer 2.0 — local Linux, Steam Frame and Android/Lepton." \
            release/*
